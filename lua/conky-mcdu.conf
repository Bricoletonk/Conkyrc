-- ==========================================================
--  Conky MCDU — configuration de la fenêtre
--  Fichier modèle : scripts/install-mcdu.sh remplace les @MARQUEURS@
--  et l'installe dans ~/.config/conky/mcdu.conf
--
--  Tout le contenu est dessiné par mcdu.lua ; ce fichier ne règle que
--  la fenêtre (position, taille, transparence).
-- ==========================================================

conky.config = {
    -- Moteur Lua : dessine le panneau à chaque rafraîchissement
    lua_load = '@DIR@/mcdu.lua',
    lua_draw_hook_post = 'mcdu @PROFIL@',
    -- Curseur posé 0,5 s sur le - ou le + d'un titre : replie ou déploie la section
    lua_mouse_hook = 'mcdu_souris',
    -- Dessin 10 fois par seconde pour l'animation (les mesures restent à 1 par seconde),
    -- 2 fois par seconde sur batterie
    update_interval = 0.1,
    update_interval_on_battery = 0.5,

    -- Fenêtre posée sur le bureau, sans décoration, entièrement transparente :
    -- le fond semi-opaque est dessiné par le script
    background = true,
    double_buffer = true,
    own_window = true,
    own_window_class = 'Conky',
    -- Fenêtre « normale » gardée sous les autres : le type 'desktop'
    -- ne reçoit pas les clics sous GNOME
    own_window_type = 'normal',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_argb_visual = true,
    own_window_argb_value = 0,

    -- Position : coin supérieur droit, sous la barre de GNOME
    -- (un panneau secondaire est décalé vers la gauche)
    alignment = 'top_right',
    gap_x = @GAPX@,
    gap_y = 45,

    -- Taille : largeur du profil + 2 × marge ; hauteur maximale du panneau
    minimum_width = @LARGEUR@,
    maximum_width = @LARGEUR@,
    minimum_height = @HAUTEUR@,

    draw_borders = false,
    draw_outline = false,
    draw_shades = false,
    use_xft = true,
    font = 'B612 Mono:size=8',
    text_buffer_size = 256,
}

-- Aucun texte : la fenêtre garde la taille minimale définie ci-dessus
conky.text = [[ ]]
